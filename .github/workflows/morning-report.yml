name: 股票盘前晨报

on:
#  schedule:
    # 北京时间 06:30（UTC+8）= UTC 前一天 22:30；周一~周五 = UTC 周日~周四
#    - cron: "30 22 * * 0-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  morning-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 lxml apscheduler python-dotenv

      - name: Generate report & push to Feishu (optional)
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          LARK_SECRET: ${{ secrets.LARK_SECRET }}
        run: python main.py --now

      - name: Commit report back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "无新报告，跳过提交"
          else
            git commit -m "chore: 盘前晨报 $(TZ=Asia/Shanghai date +'%Y-%m-%d')"
            git push
          fi
