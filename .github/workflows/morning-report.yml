name: 股票盘前晨报

on:
  schedule:
    # 北京时间 06:30（UTC+8）= UTC 前一天 22:30
    # 周一~周五(北京) 对应 UTC 周日~周四，cron 星期字段 0-4
    - cron: "30 22 * * 0-4"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发一次

permissions:
  contents: write        # 需要写权限把报告 commit 回仓库

jobs:
  morning-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 lxml apscheduler python-dotenv

      - name: Generate morning report
        run: python main.py --now

      - name: Commit report back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "无新报告，跳过提交"
          else
            git commit -m "chore: 盘前晨报 $(TZ=Asia/Shanghai date +'%Y-%m-%d')"
            git push
          fi

      # 可选：飞书推送。先在仓库 Settings → Secrets 配置 LARK_WEBHOOK（飞书自定义机器人 webhook），
      # 配置后每次运行会把最新晨报以文本消息发到对应群；留空则跳过。
      - name: Push to Feishu (optional)
        if: ${{ env.LARK_WEBHOOK != '' }}
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: |
          python - <<'PY'
          import os, json, glob, urllib.request
          files = sorted(glob.glob('reports/*_morning_brief.txt'))
          content = open(files[-1], encoding='utf-8').read() if files else '今日晨报为空'
          if len(content) > 19000:
              content = content[:19000] + "\n…(已截断)"
          payload = json.dumps({"msg_type": "text", "content": {"text": content}}).encode("utf-8")
          req = urllib.request.Request(
              os.environ['LARK_WEBHOOK'],
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          try:
              urllib.request.urlopen(req, timeout=15)
              print("飞书推送成功")
          except Exception as e:
              print("飞书推送失败:", e)
          PY
