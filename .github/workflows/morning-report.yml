name: 股票盘前晨报

on:
  schedule:
    # 北京时间 06:30 = UTC 22:30（前一日）；仅周一至周五
    - cron: '30 22 * * 1-7'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 生成盘前晨报
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: python main.py --now

      - name: 提交报告回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "chore: 自动生成盘前晨报 $(date +%Y-%m-%d)" || echo "no changes"
          git push
